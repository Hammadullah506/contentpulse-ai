<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark Minimal Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Subtle Border Ring -->
    <linearGradient id="border" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Core Pulse Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Black Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bg)" stroke="url(#border)" stroke-width="12" />

  <!-- Subtle Inner Grid / Matrix Guide (High-Tech Engineering Detail) -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="80" y1="256" x2="432" y2="256" stroke-dasharray="8 8" />
    <line x1="256" y1="80" x2="256" y2="432" stroke-dasharray="8 8" />
    <circle cx="256" cy="256" r="140" stroke-dasharray="6 8" />
  </g>

  <!-- Precision Geometric Signal Waveform (ContentPulse Core) -->
  <path
    d="M 72 256 L 152 256 L 208 116 L 304 396 L 360 216 L 396 256 L 440 256"
    stroke="#ffffff"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Emerald Live Pulse Node -->
  <circle cx="304" cy="396" r="22" fill="#10b981" />
  <circle cx="304" cy="396" r="32" stroke="#10b981" stroke-width="4" opacity="0.6" />
</svg>
